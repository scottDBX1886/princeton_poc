resources:
  catalogs:
    princeton_poc:
      name: ${var.catalog}
      comment: "Princeton POC shared data foundation"
      storage_root: ${var.storage_root}   # omit this line to inherit metastore default
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: bronze${var.schema_suffix}
    silver:
      catalog_name: ${var.catalog}
      name: silver${var.schema_suffix}
    gold:
      catalog_name: ${var.catalog}
      name: gold${var.schema_suffix}
    landing:
      catalog_name: ${var.catalog}
      name: landing${var.schema_suffix}
    models:
      catalog_name: ${var.catalog}
      name: models${var.schema_suffix}
      comment: "UC-registered MLflow models (DS-06(b) / DS-E)"
  volumes:
    landing_files:
      catalog_name: ${var.catalog}
      schema_name: landing${var.schema_suffix}
      name: files
      volume_type: MANAGED
