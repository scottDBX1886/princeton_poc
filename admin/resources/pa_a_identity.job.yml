# PA-A — identity & access setup (PA-01 … PA-06).
#
# Applies the UC grants every later PA scenario depends on. PA-B (masking) and PA-C (row filters)
# branch on the same identities, so this must run before either.
#
# It does NOT create groups: this workspace has one UC-grantable group (`account users`) and we
# hold no account-admin rights, so new groups would come out as SCIM WorkspaceGroup and UC would
# reject them with PRINCIPAL_DOES_NOT_EXIST. The role model uses the identities that already exist.
#
# Picked up automatically by the root databricks.yml `include: "*/resources/*.yml"` glob.
# notebook_path is relative to THIS file's directory (admin/resources -> ../src/...).
#
# Serverless, like every other job in this bundle — no node_type_id to keep in step with a cloud
# provider.
#
# Re-runnable: group creation is idempotent (skips existing) and GRANT is additive, so a second run
# is a no-op rather than an error.
resources:
  jobs:
    pa_a_identity_access:
      name: "[${var.catalog}] PA-A — Identity & access (PA-01…06)"
      tags:
        persona: platform_admin
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_suffix
          default: ${var.schema_suffix}
        - name: prod_catalog
          default: ${var.prod_catalog}
        - name: restricted_role
          default: ${var.restricted_role}
        - name: admin_group
          default: ${var.admin_group}
      max_concurrent_runs: 1
      tasks:
        - task_key: identity_access
          notebook_task:
            notebook_path: ../src/pa_a_identity_access.py
            base_parameters:
              catalog: ${var.catalog}
              schema_suffix: ${var.schema_suffix}
              prod_catalog: ${var.prod_catalog}
              restricted_role: ${var.restricted_role}
              admin_group: ${var.admin_group}
