<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Princeton POC — Interactive Runbook</title>
  <style>
    :root {
      /* Modern SaaS console palette */
      --bg-primary: #0f1419;      /* Dark, subtle depth */
      --bg-secondary: #16191f;    /* Slightly lighter for panels */
      --bg-tertiary: #1e2229;     /* For code/elevated surfaces */
      --text-primary: #e8eaed;    /* High contrast white */
      --text-secondary: #a8aeb5;  /* Muted for captions */
      --border: #262d35;          /* Subtle dividers */
      --accent-brand: #ff6b35;    /* Vibrant orange */
      --accent-success: #10b981;  /* Clear green */
      --accent-warning: #f59e0b;  /* Warm amber */
      --code-bg: #0d0f14;         /* True dark for code */
      --code-fg: #e8eaed;         /* Crisp monospace */
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Header */
    header.top {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      box-shadow: var(--shadow-md);
    }
    header.top h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }
    header.top p {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 900px;
      line-height: 1.5;
    }

    /* Persona bar */
    .persona-bar {
      display: flex;
      gap: 8px;
      padding: 16px 32px 0;
      background: var(--bg-primary);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .persona-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 13.5px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }
    .persona-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 107, 53, 0.08);
    }
    .persona-btn.active {
      color: var(--accent-brand);
      border-bottom-color: var(--accent-brand);
    }

    .persona-blurb {
      padding: 12px 32px;
      color: var(--text-secondary);
      font-size: 13.5px;
      max-width: 1200px;
      line-height: 1.5;
      border-bottom: 1px solid var(--border);
    }

    /* Main layout */
    .layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 200px);
    }

    /* Left sidebar nav */
    nav.tabs {
      flex: 0 0 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    nav.tabs::-webkit-scrollbar {
      width: 6px;
    }
    nav.tabs::-webkit-scrollbar-track {
      background: transparent;
    }
    nav.tabs::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    nav.tabs::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    .tab {
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      transition: all 0.12s ease;
    }
    .tab:hover {
      background: rgba(255, 107, 53, 0.05);
      color: var(--text-primary);
    }
    .tab.active {
      background: rgba(255, 107, 53, 0.12);
      border-color: var(--accent-brand);
      color: var(--text-primary);
      font-weight: 600;
    }
    .tab .id {
      font-weight: 700;
      color: var(--accent-brand);
      font-size: 11px;
      min-width: 40px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .tab .ttl {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .dot {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .dot.tested {
      background: var(--accent-success);
      box-shadow: 0 0 4px var(--accent-success);
    }
    .dot.walkthrough {
      background: var(--accent-warning);
      box-shadow: 0 0 4px var(--accent-warning);
    }

    /* Main detail pane */
    main.detail {
      flex: 1 1 auto;
      min-width: 0;
      padding: 32px 40px;
      overflow-y: auto;
    }
    main.detail::-webkit-scrollbar {
      width: 8px;
    }
    main.detail::-webkit-scrollbar-track {
      background: transparent;
    }
    main.detail::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    main.detail::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 32px;
    }

    /* Object header */
    .obj-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .obj-head .oid {
      font-size: 12px;
      font-weight: 800;
      color: var(--bg-primary);
      background: var(--accent-brand);
      padding: 4px 12px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .obj-head h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      flex: 1;
      min-width: 300px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .badge.tested {
      color: var(--accent-success);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.walkthrough {
      color: var(--accent-warning);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .meta-row {
      margin: 16px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .meta-row b {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Sections */
    section.block {
      margin-top: 28px;
    }
    section.block:first-of-type {
      margin-top: 0;
    }
    section.block > h3 {
      margin: 0 0 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-brand);
      font-weight: 700;
    }

    .proves {
      font-size: 15px;
      line-height: 1.6;
    }

    /* Steps — the redesigned core */
    ol.steps {
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step-counter;
    }
    .step-item {
      counter-increment: step-counter;
      margin: 20px 0;
      display: flex;
      gap: 16px;
    }
    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: rgba(255, 107, 53, 0.15);
      border: 1px solid var(--accent-brand);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: var(--accent-brand);
      margin-top: 2px;
    }
    .step-content {
      flex: 1;
    }
    .step-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .step-code-blocks {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 8px;
    }
    /* header bar: language label (left) + copy button (right) — no overlap with code */
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
    }
    .code-lang {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    .code-body {
      margin: 0;
      padding: 12px 14px;
      font-family: "SF Mono", "Monaco", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: var(--code-fg);
      overflow-x: auto;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .code-block-copy {
      background: rgba(255, 107, 53, 0.2);
      color: var(--accent-brand);
      border: 1px solid rgba(255, 107, 53, 0.4);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
      font-family: inherit;
      flex: none;
    }
    .code-block-copy:hover {
      background: rgba(255, 107, 53, 0.3);
      border-color: var(--accent-brand);
    }
    .code-block-copy.copied {
      background: var(--accent-success);
      color: var(--bg-primary);
      border-color: var(--accent-success);
    }

    /* Prompt block */
    .prompt-wrap {
      position: relative;
      margin-top: 12px;
    }
    .hint {
      color: var(--text-secondary);
      font-size: 13px;
      margin: 0 0 10px;
      line-height: 1.5;
    }
    /* prompt now reuses .code-block/.code-body chrome; only override line-height */
    pre.prompt { line-height: 1.6; }

    /* Outcome */
    .outcome {
      background: rgba(16, 185, 129, 0.08);
      border-left: 3px solid var(--accent-success);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 3px solid var(--accent-success);
    }

    /* Outcome checklist */
    ul.outcome-list {
      list-style: none;
      margin: 0;
      padding: 14px 16px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 3px solid var(--accent-success);
      border-radius: 0 var(--radius) var(--radius) 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    ul.outcome-list li {
      position: relative;
      padding-left: 26px;
      font-size: 14px;
      line-height: 1.5;
    }
    ul.outcome-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-success);
      font-weight: 700;
    }

    /* Notes */
    ul.notes {
      margin: 0;
      padding-left: 20px;
      list-style: disc;
    }
    ul.notes li {
      margin: 8px 0;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Media slot */
    .media-slot {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      color: var(--text-secondary);
      font-size: 13.5px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .media-grid img,
    .media-grid video {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: block;
    }
    .media-cap {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Home / Coverage map */
    .home-summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 20px 0 24px;
    }
    .home-summary .stat {
      flex: 1 1 280px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 3px solid var(--accent-success);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 16px 18px;
    }
    .home-summary .stat-num {
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .home-legend {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    table.cov {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.cov th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    table.cov td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    table.cov tr.persona-row td {
      background: rgba(255, 107, 53, 0.12);
      color: var(--accent-brand);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
    }
    table.cov tr.section-row td {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 12px;
      padding: 8px 12px;
    }
    table.cov tr.clickable {
      cursor: pointer;
    }
    table.cov tr.clickable:hover td {
      background: rgba(255, 107, 53, 0.06);
    }
    table.cov td.c-id {
      font-weight: 700;
      color: var(--accent-brand);
      white-space: nowrap;
    }
    table.cov td.c-obj {
      font-weight: 600;
      white-space: nowrap;
    }
    table.cov td.c-built {
      text-align: center;
      font-size: 15px;
    }
    .go {
      color: var(--accent-brand);
      font-weight: 700;
    }
    .ppill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      display: inline-block;
      letter-spacing: 0.3px;
    }
    .ppill.p-tested {
      color: var(--accent-success);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .ppill.p-na {
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }
    .ppill.p-parked {
      color: var(--accent-warning);
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .ppill.p-none {
      color: var(--text-secondary);
      background: transparent;
    }

    footer {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 28px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }
      nav.tabs {
        flex: 0 0 auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        padding: 12px;
      }
      main.detail {
        padding: 24px 20px;
      }
      .card {
        padding: 24px;
      }
      .obj-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .obj-head h2 {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="app-title">Princeton POC — Interactive Runbook</h1>
    <p id="app-subtitle"></p>
  </header>

  <div class="persona-bar" id="persona-bar"></div>
  <div class="persona-blurb" id="persona-blurb"></div>

  <div class="layout">
    <nav class="tabs" id="tabs"></nav>
    <main class="detail"><div class="card" id="detail">Loading…</div></main>
  </div>

  <footer>Princeton Data Platform POC · Databricks + Slalom</footer>

  <script>
    const state = { data: null, view: "home", personaIdx: 0, objIdx: 0 };

    async function boot() {
      const res = await fetch("data.json", { cache: "no-store" });
      state.data = await res.json();
      document.getElementById("app-title").textContent = state.data.title;
      document.getElementById("app-subtitle").textContent = state.data.subtitle;
      renderPersonaBar();
      render();
    }

    function renderPersonaBar() {
      const bar = document.getElementById("persona-bar");
      bar.innerHTML = "";
      // Home tab first
      const home = document.createElement("button");
      home.className = "persona-btn" + (state.view === "home" ? " active" : "");
      home.textContent = "🏠 Coverage Home";
      home.onclick = () => { state.view = "home"; render(); renderPersonaBar(); };
      bar.appendChild(home);
      // Persona tabs
      state.data.personas.forEach((p, i) => {
        const b = document.createElement("button");
        b.className = "persona-btn" + (state.view === "persona" && i === state.personaIdx ? " active" : "");
        b.textContent = p.name;
        b.onclick = () => { state.view = "persona"; state.personaIdx = i; state.objIdx = 0; render(); renderPersonaBar(); };
        bar.appendChild(b);
      });
    }

    // Jump from a Home coverage row to the build object's tab (if it exists).
    function jumpToObject(objId) {
      for (let pi = 0; pi < state.data.personas.length; pi++) {
        const oi = state.data.personas[pi].objects.findIndex(o => o.id === objId);
        if (oi >= 0) {
          state.view = "persona";
          state.personaIdx = pi;
          state.objIdx = oi;
          render();
          renderPersonaBar();
          window.scrollTo(0, 0);
          return;
        }
      }
    }

    function render() {
      if (state.view === "home") {
        renderHome();
        return;
      }
      const persona = state.data.personas[state.personaIdx];
      document.getElementById("persona-blurb").textContent = persona.blurb;
      document.getElementById("tabs").style.display = "";
      renderTabs(persona);
      renderDetail(persona.objects[state.objIdx]);
    }

    function renderHome() {
      const h = state.data.home;
      document.getElementById("persona-blurb").textContent =
        "How every RFP scenario maps to what we built. Click any row to open that build object.";
      document.getElementById("tabs").style.display = "none";

      const builtPill = { done: "✅", partial: "🟡", planned: "⬜" };
      const promptPill = { tested: "🟢 verified", na: "walkthrough", parked: "⏸ parked", "": "—" };
      const promptCls = { tested: "p-tested", na: "p-na", parked: "p-parked", "": "p-none" };

      let rows = "";
      let lastPersona = "";
      h.groups.forEach(g => {
        if (g.persona !== lastPersona) {
          rows += `<tr class="persona-row"><td colspan="5">${esc(g.persona)}</td></tr>`;
          lastPersona = g.persona;
        }
        rows += `<tr class="section-row"><td colspan="5">${esc(g.section)}</td></tr>`;
        g.rows.forEach(r => {
          const hasTab = state.data.personas.some(p => p.objects.some(o => o.id === r.object));
          rows += `<tr class="${hasTab ? "clickable" : ""}" ${hasTab ? `onclick="jumpToObject('${esc(r.object)}')"` : ""}>
            <td class="c-id">${esc(r.id)}</td>
            <td>${esc(r.name)}</td>
            <td class="c-obj">${esc(r.objectLabel || r.object)}${hasTab ? ' <span class="go">↗</span>' : ""}</td>
            <td class="c-built">${builtPill[r.built] || ""}</td>
            <td class="c-prompt"><span class="ppill ${promptCls[r.prompt] ?? "p-none"}">${promptPill[r.prompt] ?? "—"}</span></td>
          </tr>`;
        });
      });

      document.getElementById("detail").innerHTML = `
        <h2 style="margin:0 0 8px;font-size:26px;">RFP Scenario Coverage Map</h2>
        <div class="home-summary">
          <div class="stat"><div class="stat-num">${esc(h.summary.built)}</div></div>
          <div class="stat"><div class="stat-num">${esc(h.summary.prompt)}</div></div>
        </div>
        <div class="home-legend">${esc(h.summary.legendBuilt)} &nbsp;·&nbsp; ${esc(h.summary.legendPrompt)}</div>
        <table class="cov">
          <thead><tr><th>RFP ID</th><th>Requirement</th><th>Build object</th><th>Built</th><th>Prompt</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderTabs(persona) {
      const nav = document.getElementById("tabs");
      nav.innerHTML = "";
      persona.objects.forEach((o, i) => {
        const t = document.createElement("button");
        t.className = "tab" + (i === state.objIdx ? " active" : "");
        t.innerHTML = `<span class="id">${esc(o.id)}</span><span class="ttl">${esc(o.title)}</span><span class="dot ${o.status}"></span>`;
        t.onclick = () => { state.objIdx = i; render(); };
        nav.appendChild(t);
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    /**
     * Detects inline code in a step string and extracts it.
     * Returns { prose: string, codeBlocks: [{type, code}] }
     * - type: "shell" for databricks/git/cli commands, "sql" for SQL, null for plain code
     */
    function extractCodeFromStep(stepText) {
      const codeBlocks = [];
      let prose = stepText;

      // Conservative: only pull out fragments that are UNAMBIGUOUSLY code — a real CLI
      // invocation or a real SQL statement. Prose that merely mentions a product name
      // ("in the Databricks Assistant…") or a dotted word must NOT become a code block.

      // Shell: `databricks <known-verb> …` or `git <verb> …` — verb gate avoids matching
      // "Databricks Assistant". Case-sensitive lowercase `databricks`/`git` = the actual command.
      const shellPattern = /\b(databricks\s+(?:bundle|fs|jobs|pipelines|apps|warehouses|secrets|workspace|catalogs|schemas|tables|current-user|auth|api|lakeview|genie|experimental)\b[^\n]*|git\s+(?:log|tag|revert|clone|checkout|status|diff|commit|push|pull)\b[^\n]*)/g;
      let m;
      while ((m = shellPattern.exec(stepText)) !== null) {
        let cmd = m[0].trim().replace(/[.\s]+$/, "");
        if (!codeBlocks.some(b => b.code === cmd)) codeBlocks.push({ type: "shell", code: cmd });
        prose = prose.replace(m[0], " ");
      }

      // SQL: a real statement STARTING with a DDL/DML keyword. Require it to look like SQL
      // (has parentheses, or SELECT/FROM/SET/AS), not just any sentence containing "create".
      const sqlPattern = /\b(SELECT|CREATE(?:\s+OR\s+REPLACE)?|UPDATE|ALTER|DROP|INSERT|DELETE|MERGE|WITH)\b[^\n]*/g;
      while ((m = sqlPattern.exec(stepText)) !== null) {
        let frag = m[0].trim().replace(/\s+$/, "");
        // must contain another SQL token to qualify as a statement (guards against prose)
        if (/\b(FROM|WHERE|SET|TABLE|VALUES|AS|ON|SELECT)\b|\(/i.test(frag.slice(m[0].split(/\s+/)[0].length))) {
          // trim a trailing sentence period
          frag = frag.replace(/\.\s*$/, "");
          if (!codeBlocks.some(b => b.code === frag)) codeBlocks.push({ type: "sql", code: frag });
          prose = prose.replace(m[0], " ");
        }
      }

      // Paths: /Volumes/… /Workspace/… dbfs:/… — render inline as code chips, keep in prose position
      const pathPattern = /(\/Volumes\/\S+|\/Workspace\/\S+|dbfs:\/\S+)/g;
      while ((m = pathPattern.exec(stepText)) !== null) {
        const path = m[0].replace(/[.\s]+$/, "");
        if (!codeBlocks.some(b => b.code === path)) codeBlocks.push({ type: "path", code: path });
      }

      prose = prose.replace(/\s{2,}/g, " ").trim();
      return { prose, codeBlocks };
    }

    function renderOutcome(text) {
      if (!text) return "";
      // Split a multi-part outcome into a checklist: prefer " · " separators, else "SE-nn:" markers.
      let parts;
      if (text.includes(" · ")) {
        parts = text.split(" · ");
      } else {
        const m = text.match(/(SE-\d+:[^]*?)(?=(?:SE-\d+:)|$)/g);
        parts = m && m.length > 1 ? m : [text];
      }
      parts = parts.map(s => s.trim().replace(/\.$/, "")).filter(Boolean);
      if (parts.length <= 1) {
        return `<div class="outcome">${esc(text)}</div>`;
      }
      return `<ul class="outcome-list">${parts.map(pp => `<li>${esc(pp)}</li>`).join("")}</ul>`;
    }

    function renderDetail(o) {
      const badgeLabel = o.status === "tested" ? "Prompt verified" : "Guided walkthrough";
      let html = `
        <div class="obj-head">
          <span class="oid">${esc(o.id)}</span>
          <h2>${esc(o.title)}</h2>
          <span class="badge ${o.status}">${badgeLabel}</span>
        </div>
        <div class="meta-row">
          <span><b>RFP scenarios:</b> ${esc(o.scenarios)}</span>
          <span><b>Where:</b> ${esc(o.surface)}</span>
        </div>
        <section class="block"><h3>What it proves</h3><div class="proves">${esc(o.proves)}</div></section>
        <section class="block"><h3>Setup</h3><div>${esc(o.setup)}</div></section>
        <section class="block"><h3>Steps to follow</h3><ol class="steps">`;

      // Render steps with code detection
      o.steps.forEach((stepText, idx) => {
        const { prose, codeBlocks } = extractCodeFromStep(stepText);
        html += `<li class="step-item">
          <div class="step-num">${idx + 1}</div>
          <div class="step-content">
            <div class="step-text">${esc(prose)}</div>`;
        if (codeBlocks.length > 0) {
          html += `<div class="step-code-blocks">`;
          codeBlocks.forEach(block => {
            const lang = block.type === "sql" ? "sql" : (block.type === "shell" ? "bash" : (block.type === "path" ? "path" : "code"));
            html += `<div class="code-block">
              <div class="code-head"><span class="code-lang">${lang}</span><button class="code-block-copy" onclick="copyCode(this)">Copy</button></div>
              <pre class="code-body">${esc(block.code)}</pre>
            </div>`;
          });
          html += `</div>`;
        }
        html += `</div></li>`;
      });

      html += `</ol></section>`;

      if (o.prompt) {
        html += `
          <section class="block">
            <h3>Prompt to paste</h3>
            <p class="hint">Copy this into the surface named above, then substitute your own schema where you see <code>wksp_&lt;my_user&gt;</code>.</p>
            <div class="prompt-wrap code-block">
              <div class="code-head"><span class="code-lang">prompt</span><button class="code-block-copy" onclick="copyPrompt(this)">Copy</button></div>
              <pre class="prompt code-body">${esc(o.prompt)}</pre>
            </div>
          </section>`;
      }

      html += `<section class="block"><h3>Expected outcome</h3>${renderOutcome(o.outcome)}</section>`;

      if (o.notes && o.notes.length) {
        html += `<section class="block"><h3>Notes</h3><ul class="notes">${o.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>`;
      }

      // Media slot
      html += `<section class="block"><h3>Screenshots &amp; video</h3>`;
      if (o.media && o.media.length) {
        html += `<div class="media-grid">` +
          o.media.map(m => {
            if (m.type === "video") {
              return `<div><video controls src="${esc(m.src)}"></video><div class="media-cap">${esc(m.caption || "")}</div></div>`;
            }
            return `<div><img src="${esc(m.src)}" alt="${esc(m.caption || "")}" /><div class="media-cap">${esc(m.caption || "")}</div></div>`;
          }).join("") +
          `</div>`;
      } else {
        html += `<div class="media-slot">No media yet — screenshots and a walkthrough video can be added here.</div>`;
      }
      html += `</section>`;

      document.getElementById("detail").innerHTML = html;
    }

    function copyCode(btn) {
      const codeBlock = btn.closest(".code-block");
      const text = codeBlock.querySelector(".code-body").textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copied ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1400);
      });
    }

    function copyPrompt(btn) {
      const pre = btn.closest(".code-block").querySelector("pre.prompt");
      navigator.clipboard.writeText(pre.textContent).then(() => {
        btn.textContent = "Copied ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1400);
      });
    }

    boot();
  </script>
</body>
</html>
