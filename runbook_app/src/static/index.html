<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Princeton POC — Interactive Runbook</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1b2733;
      --muted: #5a6b7b;
      --line: #e3e8ee;
      --brand: #ff3621;        /* Databricks red */
      --brand-ink: #c22b18;
      --accent: #1b3139;       /* Databricks navy */
      --green: #12805c;
      --green-bg: #e5f5ef;
      --amber: #8a5a00;
      --amber-bg: #fbf0d9;
      --code-bg: #1b2733;
      --code-ink: #e8edf2;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    header.top {
      background: var(--accent);
      color: #fff;
      padding: 22px 28px;
      border-bottom: 4px solid var(--brand);
    }
    header.top h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.2px; }
    header.top p { margin: 6px 0 0; color: #c3ced6; font-size: 13.5px; max-width: 860px; }

    .persona-bar {
      display: flex; gap: 8px;
      padding: 14px 28px 0;
      background: var(--bg);
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--line);
    }
    .persona-btn {
      appearance: none; border: 1px solid var(--line); background: var(--panel);
      color: var(--muted); font-weight: 600; font-size: 14px;
      padding: 10px 18px; border-radius: 10px 10px 0 0; cursor: pointer;
      border-bottom: none; transition: all .12s ease;
    }
    .persona-btn:hover { color: var(--ink); }
    .persona-btn.active { color: var(--brand-ink); background: var(--panel); box-shadow: 0 -2px 0 var(--brand) inset; }
    .persona-blurb { padding: 12px 28px 0; color: var(--muted); font-size: 13.5px; max-width: 900px; }

    .layout { display: flex; gap: 0; padding: 18px 28px 40px; align-items: flex-start; }
    /* Object tabs (left rail) */
    nav.tabs {
      flex: 0 0 240px; position: sticky; top: 92px;
      display: flex; flex-direction: column; gap: 4px;
      max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 12px;
    }
    .tab {
      text-align: left; border: 1px solid transparent; background: transparent;
      padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13.5px;
      color: var(--ink); display: flex; align-items: center; gap: 9px; width: 100%;
    }
    .tab:hover { background: #eef1f5; }
    .tab.active { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); font-weight: 600; }
    .tab .id { font-weight: 700; color: var(--accent); font-size: 12px; min-width: 34px; }
    .tab .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .dot.tested { background: var(--green); }
    .dot.walkthrough { background: var(--amber); }

    /* Detail panel */
    main.detail { flex: 1 1 auto; min-width: 0; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 26px 30px; margin-left: 16px;
    }
    .obj-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
    .obj-head .oid {
      font-size: 13px; font-weight: 800; color: #fff; background: var(--accent);
      padding: 3px 10px; border-radius: 7px; letter-spacing: .3px;
    }
    .obj-head h2 { margin: 0; font-size: 22px; font-weight: 680; letter-spacing: -.3px; }
    .badge {
      font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .badge.tested { color: var(--green); background: var(--green-bg); }
    .badge.walkthrough { color: var(--amber); background: var(--amber-bg); }
    .meta-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 13px; }
    .meta-row b { color: var(--ink); font-weight: 600; }

    section.block { margin-top: 22px; }
    section.block > h3 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--brand-ink); font-weight: 700;
    }
    .proves { font-size: 15px; }
    ol.steps { margin: 0; padding-left: 20px; }
    ol.steps li { margin: 5px 0; font-size: 14px; }
    ul.notes { margin: 0; padding-left: 18px; }
    ul.notes li { margin: 5px 0; font-size: 13.5px; color: var(--muted); }
    .outcome { background: var(--green-bg); border-left: 3px solid var(--green); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: 14px; }

    /* Prompt block */
    .prompt-wrap { position: relative; }
    pre.prompt {
      margin: 0; background: var(--code-bg); color: var(--code-ink);
      padding: 16px 18px; border-radius: 10px; overflow-x: auto;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .copy-btn {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.22);
      border-radius: 7px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .copy-btn:hover { background: rgba(255,255,255,.26); }
    .copy-btn.copied { background: var(--green); border-color: var(--green); }
    .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }

    /* Media slot */
    .media-slot {
      border: 1.5px dashed var(--line); border-radius: 10px; padding: 20px;
      color: var(--muted); font-size: 13px; text-align: center; background: #fafbfc;
    }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 12px; }
    .media-grid img, .media-grid video { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
    .media-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Home / coverage map */
    .home-summary { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0 12px; }
    .home-summary .stat {
      flex: 1 1 300px; background: var(--green-bg); border: 1px solid #cfe9df;
      border-left: 3px solid var(--green); border-radius: 0 8px 8px 0; padding: 12px 16px;
    }
    .home-summary .stat-num { font-size: 14px; color: var(--ink); font-weight: 500; }
    .home-legend { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
    table.cov { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.cov th {
      text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--line);
      color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
      position: sticky; top: 92px; background: var(--panel); z-index: 5;
    }
    table.cov td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.cov tr.persona-row td {
      background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
      text-transform: uppercase; letter-spacing: .5px; padding: 8px 12px;
    }
    table.cov tr.section-row td {
      background: #eef1f5; color: var(--accent); font-weight: 600; font-size: 12px; padding: 6px 12px;
    }
    table.cov tr.clickable { cursor: pointer; }
    table.cov tr.clickable:hover td { background: #f2f6ff; }
    table.cov td.c-id { font-weight: 700; color: var(--accent); white-space: nowrap; }
    table.cov td.c-obj { font-weight: 600; white-space: nowrap; }
    table.cov td.c-built { text-align: center; font-size: 15px; }
    .go { color: var(--brand); font-weight: 700; }
    .ppill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
    .ppill.p-tested { color: var(--green); background: var(--green-bg); }
    .ppill.p-na { color: var(--muted); background: #eef1f5; }
    .ppill.p-parked { color: var(--amber); background: var(--amber-bg); }
    .ppill.p-none { color: #98a4b0; background: transparent; }

    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
    @media (max-width: 820px) {
      .layout { flex-direction: column; padding: 14px; }
      nav.tabs { position: static; flex-direction: row; flex-wrap: wrap; max-height: none; width: 100%; }
      .card { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="app-title">Princeton POC — Interactive Runbook</h1>
    <p id="app-subtitle"></p>
  </header>

  <div class="persona-bar" id="persona-bar"></div>
  <div class="persona-blurb" id="persona-blurb"></div>

  <div class="layout">
    <nav class="tabs" id="tabs"></nav>
    <main class="detail"><div class="card" id="detail">Loading…</div></main>
  </div>

  <footer>Princeton Data Platform POC · Databricks + Slalom</footer>

  <script>
    const state = { data: null, view: "home", personaIdx: 0, objIdx: 0 };

    async function boot() {
      const res = await fetch("data.json", { cache: "no-store" });
      state.data = await res.json();
      document.getElementById("app-title").textContent = state.data.title;
      document.getElementById("app-subtitle").textContent = state.data.subtitle;
      renderPersonaBar();
      render();
    }

    function renderPersonaBar() {
      const bar = document.getElementById("persona-bar");
      bar.innerHTML = "";
      // Home tab first
      const home = document.createElement("button");
      home.className = "persona-btn" + (state.view === "home" ? " active" : "");
      home.textContent = "🏠 Coverage Home";
      home.onclick = () => { state.view = "home"; render(); renderPersonaBar(); };
      bar.appendChild(home);
      // Persona tabs
      state.data.personas.forEach((p, i) => {
        const b = document.createElement("button");
        b.className = "persona-btn" + (state.view === "persona" && i === state.personaIdx ? " active" : "");
        b.textContent = p.name;
        b.onclick = () => { state.view = "persona"; state.personaIdx = i; state.objIdx = 0; render(); renderPersonaBar(); };
        bar.appendChild(b);
      });
    }

    // Jump from a Home coverage row to the build object's tab (if it exists).
    function jumpToObject(objId) {
      for (let pi = 0; pi < state.data.personas.length; pi++) {
        const oi = state.data.personas[pi].objects.findIndex(o => o.id === objId);
        if (oi >= 0) { state.view = "persona"; state.personaIdx = pi; state.objIdx = oi; render(); renderPersonaBar(); window.scrollTo(0,0); return; }
      }
    }

    function render() {
      if (state.view === "home") { renderHome(); return; }
      const persona = state.data.personas[state.personaIdx];
      document.getElementById("persona-blurb").textContent = persona.blurb;
      document.getElementById("tabs").style.display = "";
      renderTabs(persona);
      renderDetail(persona.objects[state.objIdx]);
    }

    function renderHome() {
      const h = state.data.home;
      document.getElementById("persona-blurb").textContent =
        "How every RFP scenario maps to what we built. Click any row to open that build object.";
      document.getElementById("tabs").style.display = "none";  // Home is full-width

      const builtPill = { done:'✅', partial:'🟡', planned:'⬜' };
      const promptPill = { tested:'🟢 verified', na:'walkthrough', parked:'⏸ parked', '':'—' };
      const promptCls  = { tested:'p-tested', na:'p-na', parked:'p-parked', '':'p-none' };

      let rows = "";
      let lastPersona = "";
      h.groups.forEach(g => {
        if (g.persona !== lastPersona) {
          rows += `<tr class="persona-row"><td colspan="5">${esc(g.persona)}</td></tr>`;
          lastPersona = g.persona;
        }
        rows += `<tr class="section-row"><td colspan="5">${esc(g.section)}</td></tr>`;
        g.rows.forEach(r => {
          const hasTab = state.data.personas.some(p => p.objects.some(o => o.id === r.object));
          rows += `<tr class="${hasTab ? 'clickable' : ''}" ${hasTab ? `onclick="jumpToObject('${esc(r.object)}')"` : ''}>
            <td class="c-id">${esc(r.id)}</td>
            <td>${esc(r.name)}</td>
            <td class="c-obj">${esc(r.object)}${hasTab ? ' <span class="go">↗</span>' : ''}</td>
            <td class="c-built">${builtPill[r.built] || ''}</td>
            <td class="c-prompt"><span class="ppill ${promptCls[r.prompt] ?? 'p-none'}">${promptPill[r.prompt] ?? '—'}</span></td>
          </tr>`;
        });
      });

      document.getElementById("detail").innerHTML = `
        <h2 style="margin:0 0 4px;font-size:22px;">RFP Scenario Coverage Map</h2>
        <div class="home-summary">
          <div class="stat"><div class="stat-num">${esc(h.summary.built)}</div></div>
          <div class="stat"><div class="stat-num">${esc(h.summary.prompt)}</div></div>
        </div>
        <div class="home-legend">${esc(h.summary.legendBuilt)} &nbsp;·&nbsp; ${esc(h.summary.legendPrompt)}</div>
        <table class="cov">
          <thead><tr><th>RFP ID</th><th>Requirement</th><th>Build object</th><th>Built</th><th>Prompt</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderTabs(persona) {
      const nav = document.getElementById("tabs");
      nav.innerHTML = "";
      persona.objects.forEach((o, i) => {
        const t = document.createElement("button");
        t.className = "tab" + (i === state.objIdx ? " active" : "");
        t.innerHTML = `<span class="id">${o.id}</span><span class="ttl">${o.title}</span><span class="dot ${o.status}" title="${o.status}"></span>`;
        t.onclick = () => { state.objIdx = i; render(); };
        nav.appendChild(t);
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function renderDetail(o) {
      const badgeLabel = o.status === "tested" ? "Prompt verified" : "Guided walkthrough";
      let html = `
        <div class="obj-head">
          <span class="oid">${esc(o.id)}</span>
          <h2>${esc(o.title)}</h2>
          <span class="badge ${o.status}">${badgeLabel}</span>
        </div>
        <div class="meta-row">
          <span><b>RFP scenarios:</b> ${esc(o.scenarios)}</span>
          <span><b>Where:</b> ${esc(o.surface)}</span>
        </div>
        <section class="block"><h3>What it proves</h3><div class="proves">${esc(o.proves)}</div></section>
        <section class="block"><h3>Setup</h3><div>${esc(o.setup)}</div></section>
        <section class="block"><h3>Steps to follow</h3><ol class="steps">${o.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>
      `;

      if (o.prompt) {
        html += `
          <section class="block">
            <h3>Prompt to paste</h3>
            <p class="hint">Copy this into the surface named above, then substitute your own schema where you see <code>wksp_&lt;my_user&gt;</code>.</p>
            <div class="prompt-wrap">
              <button class="copy-btn" onclick="copyPrompt(this)">Copy</button>
              <pre class="prompt">${esc(o.prompt)}</pre>
            </div>
          </section>`;
      }

      html += `<section class="block"><h3>Expected outcome</h3><div class="outcome">${esc(o.outcome)}</div></section>`;

      if (o.notes && o.notes.length) {
        html += `<section class="block"><h3>Notes</h3><ul class="notes">${o.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>`;
      }

      // Media slot — renders images/videos when present, else a placeholder for later.
      html += `<section class="block"><h3>Screenshots &amp; video</h3>`;
      if (o.media && o.media.length) {
        html += `<div class="media-grid">` + o.media.map(m => {
          if (m.type === "video") return `<div><video controls src="${esc(m.src)}"></video><div class="media-cap">${esc(m.caption||"")}</div></div>`;
          return `<div><img src="${esc(m.src)}" alt="${esc(m.caption||"")}" /><div class="media-cap">${esc(m.caption||"")}</div></div>`;
        }).join("") + `</div>`;
      } else {
        html += `<div class="media-slot">No media yet — screenshots and a walkthrough video can be added here.</div>`;
      }
      html += `</section>`;

      document.getElementById("detail").innerHTML = html;
    }

    function copyPrompt(btn) {
      const pre = btn.parentElement.querySelector("pre.prompt");
      navigator.clipboard.writeText(pre.textContent).then(() => {
        btn.textContent = "Copied ✓"; btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1600);
      });
    }

    boot();
  </script>
</body>
</html>
