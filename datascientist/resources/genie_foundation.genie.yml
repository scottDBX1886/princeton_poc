# Genie space over the shared foundation — the NO-CODE path for DS-01 (and reused by the
# Business Analyst scenarios later). Read-only by nature, so it is safe to share across
# all ~20 concurrent participants; no per-person isolation needed (spec §3.1 rule 6).
#
# NOTE on schema: the DAB `genie_spaces` resource takes `title`/`description`/`warehouse_id`/
# `parent_path` + either inline `serialized_space` or `file_path` to a `.geniespace.json`.
# The serialized body's real shape (learned via `databricks bundle generate genie-space`):
#   config.sample_questions[].{id,question[]} · data_sources.tables[].identifier ·
#   instructions.text_instructions[].{content[],id} · version:"2".
# NOT a flat `table_identifiers` array (that's rejected: "Unknown field 'table_identifiers'").
# GOTCHA: data_sources.tables MUST be sorted by identifier or create fails INVALID_PARAMETER_VALUE.
resources:
  genie_spaces:
    foundation:
      title: "[${var.catalog}] Data Foundation"
      description: >-
        Natural-language exploration over the shared higher-ed data foundation.
        Surfaces the gold enrollment fact and the silver dimensions for ad-hoc
        analysis without SQL (DS-01).
      warehouse_id: ${var.warehouse_id}
      file_path: ../src/genie_foundation.geniespace.json
      parent_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}/genie
