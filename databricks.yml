bundle:
  name: princeton_poc

variables:
  catalog:
    description: Target UC catalog
    default: princeton_poc
  schema_suffix:
    description: Environment suffix on layer schema names (dev=_dev, qa=_test, prod=empty). Threads to schemas, the landing volume path, and notebooks.
    default: ""
  storage_root:
    description: Managed storage location URL for the catalog (external location or metastore-managed path). Operator sets per target.
    default: ""   # MUST be overridden per target with a real storage URL, or drop storage_root from the catalog resource to inherit metastore default
  warehouse_id:
    description: SQL warehouse ID for SQL-backed tasks (added in later phases). Set per target when needed.
    default: ""   # no Phase 0 resource uses a warehouse; supply an ID (e.g. from `databricks warehouses list`) when SQL tasks are added
  row_count:
    description: Rows in enrollment_history fact
    default: 5000000

targets:
  dev:
    # Production mode (not development) so resource names are NOT auto-prefixed with
    # dev_<user>_. We already isolate environments by catalog + schema_suffix, so we want
    # clean, predictable schema names (bronze_dev, silver_dev, ...) here too.
    mode: production
    default: true
    workspace:
      profile: dbx_shared_demo
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc_dev"
      schema_suffix: "_dev"
      storage_root: "abfss://unity-catalog@adlsdbxdemoshared.dfs.core.windows.net/"   # internal test env (dbx_shared_demo)
      warehouse_id: "a94a22f8652d85c1"   # sled-demo-shared-endpoint (dbx_shared_demo)
  qa:
    mode: production
    workspace:
      profile: dbx_shared_demo
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc_test"
      schema_suffix: "_test"
      storage_root: "<QA_STORAGE_URL>"
      warehouse_id: "<QA_WAREHOUSE_ID>"   # set to the qa workspace's SQL warehouse before deploy (E9 dashboard needs it)
  prod:
    mode: production
    workspace:
      profile: dbx_shared_demo
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc"
      schema_suffix: ""
      storage_root: "<PROD_STORAGE_URL>"
      warehouse_id: "<PROD_WAREHOUSE_ID>"   # set to the prod workspace's SQL warehouse before deploy (E9 dashboard needs it)

include:
  # Persona-scoped resources. Each persona owns a top-level folder with its own
  # resources/ + src/ (foundation/ = the shared dataset all personas depend on).
  # This glob auto-discovers new persona folders (e.g. datascientist/) — a new
  # contributor adds <persona>/resources/*.yml with NO edit to this file.
  - "*/resources/*.yml"

# Shared deployment path (prod/qa) is intentional for a POC handed to the customer team;
# grant workspace users manage access to acknowledge the shared /Workspace/Shared path.
permissions:
  - level: CAN_MANAGE
    group_name: users
