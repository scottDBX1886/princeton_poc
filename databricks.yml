bundle:
  name: princeton_poc

variables:
  catalog:
    description: Target UC catalog
    default: princeton_poc
  schema_suffix:
    description: Environment suffix on layer schema names (dev=_dev, qa=_test, prod=empty). Threads to schemas, the landing volume path, and notebooks.
    default: ""
  warehouse_id:
    description: SQL warehouse ID for SQL-backed tasks (added in later phases). Set per target when needed.
    default: ""   # no Phase 0 resource uses a warehouse; supply an ID (e.g. from `databricks warehouses list`) when SQL tasks are added
  row_count:
    description: Rows in enrollment_history fact
    default: 5000000
  mock_api_name:
    description: Databricks App name for the SE-08 mock API. App names are workspace-global, so qa/prod override this to avoid colliding with dev's app.
    default: "princeton-mock-api"

targets:
  dev:
    # DEFAULT build environment. Points at the `princeton_poc` customer POC workspace
    # (serverless, UC default storage — no external storage_root needed for catalog creation).
    #
    # Production mode (not development) so resource names are NOT auto-prefixed with dev_<user>_.
    # We isolate environments by catalog + schema_suffix, so schema names stay clean
    # (bronze_dev, silver_dev, ...).
    mode: production
    default: true
    workspace:
      profile: princeton_poc
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc_dev"
      schema_suffix: "_dev"
      warehouse_id: "5d42098cbe21ce49"   # Serverless Starter Warehouse (princeton_poc)
  qa:
    mode: production
    workspace:
      profile: princeton_poc
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc_test"
      schema_suffix: "_test"
      warehouse_id: "5d42098cbe21ce49"   # princeton_poc Serverless Starter Warehouse
      mock_api_name: "princeton-mock-api-test"   # app names are workspace-global; qa gets its own
  prod:
    mode: production
    workspace:
      profile: princeton_poc
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "princeton_poc"
      schema_suffix: ""
      warehouse_id: "5d42098cbe21ce49"   # princeton_poc Serverless Starter Warehouse

include:
  # Persona-scoped resources. Each persona owns a top-level folder with its own
  # resources/ + src/ (foundation/ = the shared dataset all personas depend on).
  # This glob auto-discovers new persona folders (e.g. datascientist/) — a new
  # contributor adds <persona>/resources/*.yml with NO edit to this file.
  - "*/resources/*.yml"

# Shared deployment path (prod/qa) is intentional for a POC handed to the customer team;
# grant workspace users manage access to acknowledge the shared /Workspace/Shared path.
permissions:
  - level: CAN_MANAGE
    group_name: users
